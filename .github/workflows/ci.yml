name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge test --no-match-contract "GasBench|Profile" -vv

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Exercise the exact quota/lease Lua against an isolated local Redis, not a mock.
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npx vitest run
        env:
          KASKAD_REDIS_BIN: /usr/bin
      - run: npx tsc --noEmit
      - run: npx eslint .

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: scripts
      - run: npx tsc --noEmit
        working-directory: scripts

  cre:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre/kaskad-risk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      # The same compile `cre workflow simulate` runs: bundles, rejects non-WASM APIs, builds the WASM.
      - run: bun x cre-compile main.ts dist/workflow.wasm
